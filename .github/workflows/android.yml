name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install CMake
        run: sdkmanager "cmake;4.1.2"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Build debug APK
        # The native build includes generated/shards.cmake (translated game code
        # shards). That tree is gitignored and produced locally by the translate
        # pipeline from the user's game disc, so it is absent in CI clones.
        # Skip the build (and artifact upload) when it is not checked in.
        if: hashFiles('generated/build_shards/shards.cmake') != ''
        run: ./gradlew assembleDebug
        working-directory: android

      - uses: actions/upload-artifact@v7
        if: hashFiles('generated/build_shards/shards.cmake') != ''
        with:
          name: wiicompiled-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install CMake
        run: sdkmanager "cmake;4.1.2"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Run lint
        # 34 pre-existing errors live in vendored SDL3 bindings (org/libsdl/app/*),
        # not this repo's code. Report them without blocking CI until a baseline is added.
        continue-on-error: true
        run: ./gradlew lint
        working-directory: android

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: android/app/build/reports/lint-results*.html
          if-no-files-found: ignore
