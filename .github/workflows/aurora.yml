name: Aurora

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang \
            libvulkan-dev build-essential git make pkg-config \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxrender-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev \
            libudev-dev libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev libwayland-dev \
            libdecor-0-dev liburing-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DAURORA_ENABLE_GX=ON \
            -DAURORA_ENABLE_DVD=OFF \
            -DAURORA_ENABLE_CARD=ON
        working-directory: aurora-main

      - name: Build
        # Build only the unit-test targets. The full `all` target also compiles
        # examples/simple.c, which cannot build: the vendored GXGeometry.h uses a
        # C++-only `GXSetArray` overload that is illegal in C (static declaration
        # follows non-static declaration). Tests avoid that TU.
        run: cmake --build build --target gx_fifo_tests os_alloc_tests --parallel $(nproc)
        working-directory: aurora-main

      - name: Test
        run: ctest --test-dir build --output-on-failure
        working-directory: aurora-main
